version: '3.8'
services:
  bot:
    build: .
    restart: always
    env_file: .env
    depends_on:
      - postgres
      - redis
    volumes:
      - ./config.yaml:/app/config.yaml
      - ./logs:/app/logs
    ports:
      - '8000:8000'

  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: trading_bot
      POSTGRES_USER: bot
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - '5432:5432'

  redis:
    image: redis:7-alpine
    restart: always
    ports:
      - '6379:6379'

volumes:
  pgdata:
